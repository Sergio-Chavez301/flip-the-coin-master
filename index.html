<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@600&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@600&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />

    <title>Lanza la moneda | devChallenges.io</title>
    <meta
      name="description"
      content="Lanza una moneda virtual y descubre al azar si sale cara o cruz."
    />

    <!--You are welcome to delete these styles or modify them in your own stylesheet -->
    <style>
      * {
        margin-top: 40px;
        padding: 0;
        box-sizing: border-box;
        background-color: #404a65;
      }


      .container {
        font-size: 14px;
        text-align: center;
        margin-top: 16px;
      }

      .container h1 {
        font-family: "kanit", sans-serif;
        font-size: 64px;
        color: #fff;
        text-shadow: 2px 2px 0px #35383f;
        -webkit-text-stroke-width: 5px;
        -webkit-text-stroke-color: #35383f;
      }

      .container p {
        font-family: "kanit", sans-serif;
        font-weight: 600;
        font-size: 24px;
        color: #fff;

      }
      .container button {
        font-family: "kanit", sans-serif;
        font-weight: 600;
        font-size: 20px;
        color: #fff;
        background-color: #206fb1;
        border-radius: 10px;
        padding: 10px 20px;
        border: none;
        cursor: pointer;

      }
    </style>
  </head>
  <body>
      <main role="main" class="container">
        <h1>Flip a Coin Game</h1>
        <p>Press the coin or the button to flip the coin</p>
        <div  id="coin">
          <img
            src="resources/heads.svg"
            alt="Heads"
            id="coin-image"
            width="160"
            height="160"
            fetchpriority="high"
            decoding="async"
          />
        </div>
        <img
          src="resources/shadow.svg"
          alt=""
          width="100"
          height="8"
          aria-hidden="true"
          decoding="async"
        /><br />
        <p id="result">Heads</p>
        <button id="flip-button">Flip Coin</button>
      </main>
      <script role="script">
        const coinImage = document.getElementById("coin-image");
        const resultText = document.getElementById("result");
        const flipButton = document.getElementById("flip-button");

        function flipCoin() {
          const randomNumber = Math.random();
          if (randomNumber < 0.5) {
            coinImage.src = "resources/heads.svg";
            coinImage.alt = "Heads";
            resultText.textContent = "Heads";
          } else {
            coinImage.src = "resources/tails.svg";
            coinImage.alt = "Tails";
            resultText.textContent = "Tails";
          }
        }

        coinImage.addEventListener("click", flipCoin);
        flipButton.addEventListener("click", flipCoin);
      </script>
  </body>
</html>
